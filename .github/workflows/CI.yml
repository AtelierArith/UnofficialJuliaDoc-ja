name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
#env:
#  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  test:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The cached build contains binaries tuned for the CPU that built them;
      # restoring them on a runner with a different CPU crashes with
      # "Illegal instruction", so the CPU model is part of the cache key.
      - name: Identify runner CPU
        id: cpu
        run: |
          model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)
          echo "CPU:$model"
          echo "model=$(echo "$model" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Set up Julia
        id: cache-julia
        uses: actions/cache@v4
        with:
          path: ./julia
          key: ${{ runner.os }}-${{ steps.cpu.outputs.model }}-julia-${{ hashFiles('./julia/VERSION') }}

      - name: Build Julia doc
        run: bash run.sh
