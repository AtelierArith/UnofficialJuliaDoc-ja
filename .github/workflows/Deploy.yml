name: Deploy
on:
  push:
    branches: [main, master]
    tags: [v*]
  pull_request:

jobs:
  Deploy:
    permissions:
      contents: write
      statuses: write
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The cached build contains binaries tuned for the CPU that built them;
      # restoring them on a runner with a different CPU crashes with
      # "Illegal instruction", so the CPU model is part of the cache key.
      - name: Identify runner CPU
        id: cpu
        run: |
          model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)
          echo "CPU:$model"
          echo "model=$(echo "$model" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Set up Julia
        id: cache-julia
        uses: actions/cache@v4
        with:
          path: ./julia
          key: ${{ runner.os }}-${{ steps.cpu.outputs.model }}-julia-${{ hashFiles('./julia/VERSION') }}

      - name: Build Julia doc
        run: bash run.sh
      - name: Build and Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: julia/doc/_build/html/ja
