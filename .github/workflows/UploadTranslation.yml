name: UploadTranslation
on:
  push:
    branches: [main, master]
    tags: [v*]
  pull_request:

jobs:
  upload-translation:
    permissions:
      contents: write
      statuses: write
    name: UploadTranslation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publish only merged translations; a pull request would otherwise
      # overwrite the translation branch with unmerged work.
      - name: Build and Deploy
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: translation
          folder: translation
